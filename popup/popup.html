<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FanBooks Saver</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" alt="" width="24" height="24" />
      <h1>FanBooks Saver</h1>
      <select id="lang" class="lang"></select>
    </header>

    <section>
      <h2 data-i18n="popupFormat"></h2>
      <div class="formats" role="radiogroup">
        <label><input type="radio" name="format" value="txt" checked /> <span>TXT</span></label>
        <label><input type="radio" name="format" value="html" /> <span>HTML</span></label>
        <label><input type="radio" name="format" value="epub" /> <span>EPUB</span></label>
      </div>
      <div id="translate-box" class="translate" hidden>
        <label class="check"><input id="translate" type="checkbox" /> <span data-i18n="popupTranslate"></span></label>
        <p class="hint" data-i18n="popupTranslateHint"></p>
      </div>
    </section>

    <section>
      <h2 data-i18n="popupWork"></h2>
      <form id="work-form">
        <div class="field">
          <input id="link" type="text" inputmode="url" spellcheck="false" autocomplete="off" placeholder="https://archiveofourown.org/works/…" />
          <div id="ghost" class="ghost" hidden><span id="ghost-typed" class="typed"></span><span id="ghost-rest"></span></div>
          <span id="tab-key" class="kbd" hidden>Tab</span>
        </div>
        <p id="status" class="status"></p>
        <button id="download" type="submit" disabled></button>
      </form>
    </section>

    <footer>
      <div id="sites"></div>
      <a id="rate" class="rate" href="#"></a>
    </footer>

    <script src="../src/platforms.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
