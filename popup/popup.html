<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FanBooks Saver</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" alt="" width="24" height="24" />
      <h1>FanBooks Saver</h1>
      <select id="lang" class="lang"></select>
    </header>

    <section>
      <h2 data-i18n="popupFormat"></h2>
      <div class="formats" role="radiogroup">
        <label><input type="radio" name="format" value="txt" checked /> <span>TXT</span></label>
        <label><input type="radio" name="format" value="html" /> <span>HTML</span></label>
        <label><input type="radio" name="format" value="epub" /> <span>EPUB</span></label>
      </div>
    </section>

    <section>
      <h2 data-i18n="popupThisPage"></h2>
      <p id="page-status" class="status"></p>
      <button id="download-page" type="button" hidden data-i18n="popupDownload"></button>
    </section>

    <section>
      <h2 data-i18n="popupByLink"></h2>
      <form id="link-form">
        <input id="link" type="url" placeholder="https://archiveofourown.org/works/…" required />
        <button type="submit" data-i18n="popupDownloadLink"></button>
      </form>
      <p id="link-status" class="status"></p>
    </section>

    <footer>
      <div id="sites"></div>
      <a id="rate" class="rate" href="#"></a>
    </footer>

    <script src="../src/platforms.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
